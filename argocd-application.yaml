apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-infra-manifests
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/HyeonWooJo/my-infra-manifests.git
    targetRevision: main
    path: helm-chart
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

replicaCount: 2

image:
  repository: chaduri7913/my-python-app # 본인 도커 허브 ID로 수정
  tag: "1.0.2"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 8000
  nodePort: 30080  # 30001 충돌 시 변경 (30000-32767 범위)

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi